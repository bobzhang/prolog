name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check

      - name: Check all targets
        run: moon check --target all

      - name: Unit and integration tests
        run: moon test

      - name: Unit tests (wasm)
        run: moon test --target wasm

      - name: CLI transcript tests
        run: moon cram test tests/cram

      - name: Build native CLI
        run: moon build --target native

      - name: Build wasm CLI
        run: moon build --target wasm cmd/prolog
